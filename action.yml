name: Registry login
description: Load shared CI variables if needed, connect Tailscale, and log in to the private registry.
outputs:
  registry:
    description: Registry hostname loaded from Infisical
    value: ${{ steps.settings.outputs.registry }}
runs:
  using: composite
  steps:
    - name: Load shared environment if not already loaded
      if: env.DOCKER_REGISTRY_HOST == '' || env.DOCKER_REGISTRY_PASSWORD == ''
      uses: saturn30/registry-login-action/load-env@fbb41efebe9d54cf39c11891751b7ea7fcc525fa
    - name: Check caller and registry settings
      id: settings
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/scripts/ci_context.py" --settings
    - name: Connect to Tailscale
      uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
      with:
        oauth-client-id: ${{ steps.settings.outputs.client-id }}
        audience: ${{ steps.settings.outputs.audience }}
        tags: tag:ci-registry
    - name: Wait for registry connectivity
      shell: bash
      run: |
        for attempt in {1..30}; do
          status=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 5 \
            "https://$DOCKER_REGISTRY_HOST/v2/" || true)
          if [ "$status" = 401 ]; then exit 0; fi
          sleep 2
        done
        echo 'Registry connectivity check failed.' >&2
        exit 1
    - name: Login to registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ env.DOCKER_REGISTRY_HOST }}
        username: ci-push
        password: ${{ env.DOCKER_REGISTRY_PASSWORD }}
