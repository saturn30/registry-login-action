name: Verify shared registry and GitOps actions
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    if: github.repository_owner == 'saturn30' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_BRANCH: codex/verify-common-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run regression tests
        run: |
          python3 -m venv "$RUNNER_TEMP/action-tests"
          "$RUNNER_TEMP/action-tests/bin/pip" install -q -r update-manifests/requirements.txt
          "$RUNNER_TEMP/action-tests/bin/python" -m unittest discover -s tests -v
      - name: Load variables without Tailscale
        uses: ./load-env
      - name: Login using the loaded host
        uses: ./
      - name: Create isolated GitOps test branch
        id: branch
        env:
          GH_TOKEN: ${{ env.MANIFEST_UPDATE_TOKEN }}
        run: |
          sha=$(gh api repos/bluesoft9999/netcup-infra/git/ref/heads/main --jq .object.sha)
          gh api --method POST repos/bluesoft9999/netcup-infra/git/refs \
            -f ref="refs/heads/$TEST_BRANCH" -f sha="$sha" > /dev/null
          echo "base=$sha" >> "$GITHUB_OUTPUT"
      - name: Update manifests on the isolated branch
        uses: ./update-manifests
        with:
          branch: ${{ env.TEST_BRANCH }}
          manifest-path: argo/manifests/lol-stat
          images: |
            ${{ env.DOCKER_REGISTRY_HOST }}/saturn30/lol-stat/web
            ${{ env.DOCKER_REGISTRY_HOST }}/saturn30/lol-stat/server
            ${{ env.DOCKER_REGISTRY_HOST }}/saturn30/lol-stat/ingest
      - name: Check changed files
        id: changed
        env:
          GH_TOKEN: ${{ env.MANIFEST_UPDATE_TOKEN }}
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          gh api "repos/bluesoft9999/netcup-infra/compare/$BASE...$TEST_BRANCH" \
            --jq '[.files[].filename] | sort' > "$RUNNER_TEMP/changed-files.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'changed-files.json').read_text())
          expected = sorted('argo/manifests/lol-stat/' + name for name in [
              'web.deploy.yaml', 'server.deploy.yaml', 'ingest-daemon.deploy.yaml', 'server.prisma-migrate.job.yaml'])
          assert actual == expected, actual
          print('PASS: exactly the four intended workloads changed')
          PY
          sha=$(gh api "repos/bluesoft9999/netcup-infra/git/ref/heads/$TEST_BRANCH" --jq .object.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Repeat the same update
        uses: ./update-manifests
        with:
          branch: ${{ env.TEST_BRANCH }}
          manifest-path: argo/manifests/lol-stat
          images: |
            ${{ env.DOCKER_REGISTRY_HOST }}/saturn30/lol-stat/web
            ${{ env.DOCKER_REGISTRY_HOST }}/saturn30/lol-stat/server
            ${{ env.DOCKER_REGISTRY_HOST }}/saturn30/lol-stat/ingest
      - name: Verify no duplicate commit
        env:
          GH_TOKEN: ${{ env.MANIFEST_UPDATE_TOKEN }}
          EXPECTED_SHA: ${{ steps.changed.outputs.sha }}
        run: |
          actual=$(gh api "repos/bluesoft9999/netcup-infra/git/ref/heads/$TEST_BRANCH" --jq .object.sha)
          test "$actual" = "$EXPECTED_SHA"
          echo 'PASS: no duplicate commit; production main was not changed'
      - name: Remove isolated test branch
        if: always() && steps.branch.outcome == 'success'
        env:
          GH_TOKEN: ${{ env.MANIFEST_UPDATE_TOKEN }}
        run: gh api --method DELETE "repos/bluesoft9999/netcup-infra/git/refs/heads/$TEST_BRANCH"
